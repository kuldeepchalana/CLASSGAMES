<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8ਵੀਂ ਗਣਿਤ - 260 MCQ ਕਵਿਜ਼ ਗੇਮ</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --accent: #fb7185;
    --accent2: #fbbf24;
    --correct: #22c55e;
    --wrong: #ef4444;
    --gold: #facc15;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Gurmukhi', 'Raavi', system-ui, sans-serif; }
  body {
    background: radial-gradient(circle at top, #4c0519 0%, #0f172a 65%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 2px solid #334155;
    gap: 12px;
    flex-wrap: wrap;
  }
  .title-wrap h1 { font-size: 1.5rem; color: var(--accent); }
  .title-wrap p { font-size: 0.9rem; color: var(--muted); }
  .top-btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-menu { background: #fb7185; color: #0f172a; }
  .btn-menu:hover { background: #fda4af; }
  .btn-hub { background: #f59e0b; color: #0f172a; }
  .btn-hub:hover { background: #fbbf24; }
  .btn-sound { background: #334155; color: var(--text); }
  .btn-sound:hover { background: #475569; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-lb { background: rgba(250, 204, 21, 0.16); color: var(--gold); border: 1px solid rgba(250, 204, 21, 0.4); padding: 6px 12px; font-size: 0.88rem; border-radius: 10px; }
  .btn-lb:hover { background: rgba(250, 204, 21, 0.28); }

  main { flex: 1; padding: 20px 28px; max-width: 1400px; width: 100%; margin: 0 auto; }

  /* Player Name Bar */
  .player-bar {
    background: var(--card);
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 16px 22px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .player-input-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex: 1;
  }
  .player-input-group label { font-size: 1.1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .player-input-group input {
    background: #0f172a;
    color: var(--text);
    border: 2px solid #475569;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 1.1rem;
    font-weight: 600;
    min-width: 240px;
    max-width: 360px;
    flex: 1;
    outline: none;
  }
  .player-input-group input:focus { border-color: var(--accent); }
  .name-warn { color: #f87171; font-size: 0.95rem; font-weight: 700; display: none; }
  .timer-note { color: var(--muted); font-size: 0.95rem; font-weight: 600; }

  /* Chapter Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .ch-card {
    background: var(--card);
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 18px;
    transition: transform 0.18s, border-color 0.2s, background 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 138px;
  }
  .ch-card:hover { transform: translateY(-3px); border-color: var(--accent); background: #2d2030; }
  .ch-clickable { cursor: pointer; flex: 1; }
  .ch-num { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .ch-title { font-size: 1.15rem; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
  .ch-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #334155; }
  .badge { background: rgba(251, 113, 133, 0.16); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
  .badge.done { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

  /* Quiz Screen */
  .hidden { display: none !important; }
  .quiz-wrap { max-width: 1020px; margin: 0 auto; }
  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .quiz-stats { display: flex; gap: 10px; font-size: 1rem; font-weight: 700; flex-wrap: wrap; }
  .stat-pill { background: var(--card); padding: 8px 14px; border-radius: 12px; border: 1px solid #334155; }
  .timer-pill {
    background: rgba(251, 113, 133, 0.18);
    border: 2px solid var(--accent);
    color: var(--accent);
    min-width: 105px;
    text-align: center;
  }
  .timer-pill.danger {
    background: rgba(239, 68, 68, 0.25);
    border-color: var(--wrong);
    color: #fca5a5;
    animation: pulse 0.6s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

  .progress-bar {
    height: 10px;
    background: #334155;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    width: 0%;
    transition: width 0.3s ease;
  }
  .timer-bar {
    height: 7px;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .timer-fill {
    height: 100%;
    background: var(--gold);
    width: 100%;
    transition: width 1s linear, background 0.3s;
  }
  .timer-fill.danger { background: var(--wrong); }

  .q-box {
    background: var(--card);
    border: 2px solid #334155;
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 18px;
  }
  .q-chapter { font-size: 0.95rem; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 1.5rem; font-weight: 700; line-height: 1.5; }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) { .options { grid-template-columns: 1fr; } .q-text { font-size: 1.25rem; } }
  .opt-btn {
    background: var(--card);
    color: var(--text);
    border: 2px solid #475569;
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 1.18rem;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #273549; transform: translateY(-2px); }
  .opt-btn:disabled { cursor: default; }
  .opt-tag {
    min-width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--accent);
  }
  .opt-btn.correct { background: rgba(34, 197, 94, 0.22); border-color: var(--correct); }
  .opt-btn.correct .opt-tag { background: var(--correct); color: #0f172a; }
  .opt-btn.wrong { background: rgba(239, 68, 68, 0.22); border-color: var(--wrong); }
  .opt-btn.wrong .opt-tag { background: var(--wrong); color: #fff; }

  .quiz-footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 52px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .feedback { font-size: 1.18rem; font-weight: 700; }
  .feedback.ok { color: #4ade80; }
  .feedback.no { color: #f87171; }

  /* Result Screen */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 1100px;
    margin: 16px auto;
  }
  @media (max-width: 860px) { .result-grid { grid-template-columns: 1fr; } }
  .result-card, .lb-panel {
    background: var(--card);
    border: 2px solid #334155;
    border-radius: 22px;
    padding: 28px;
  }
  .result-card { border-color: var(--accent); text-align: center; }
  .stars { font-size: 2.8rem; margin-bottom: 8px; color: var(--gold); }
  .result-player { font-size: 1.15rem; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .result-score { font-size: 2.6rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
  .result-msg { font-size: 1.1rem; color: var(--muted); margin-bottom: 22px; }
  .result-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  /* Leaderboard Table */
  .lb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .lb-header h3 { font-size: 1.25rem; color: var(--gold); }
  .lb-table { width: 100%; border-collapse: collapse; font-size: 0.98rem; }
  .lb-table th, .lb-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; }
  .lb-table th { color: var(--muted); font-size: 0.88rem; }
  .lb-table tr.me { background: rgba(251, 113, 133, 0.16); font-weight: 700; }
  .lb-empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 1.05rem; }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-box {
    background: var(--card);
    border: 2px solid var(--gold);
    border-radius: 22px;
    padding: 24px 28px;
    width: 100%;
    max-width: 620px;
    max-height: 85vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

<header>
  <div class="title-wrap">
    <h1>📊 8ਵੀਂ ਗਣਿਤ — ਮੈਗਾ ਕਵਿਜ਼ ਗੇਮ</h1>
    <p>PSEB (13 ਅਧਿਆਇ × 20 MCQ = 260 ਪ੍ਰਸ਼ਨ)</p>
  </div>
  <div class="top-btns">
    <button class="btn btn-sound" id="soundToggle" onclick="toggleSound()">🔊 ਆਵਾਜ਼: ਚਾਲੂ</button>
    <button class="btn btn-menu" onclick="goHome()">📋 Back to Menu</button>
    <a class="btn btn-hub" href="../index.html" onclick="playSound('click')">🏠 Back to Hub</a>
  </div>
</header>

<main>
  <!-- Home / Chapter Selection -->
  <section id="homeScreen">
    <div class="player-bar">
      <div class="player-input-group">
        <label for="playerNameInput">👤 ਖਿਡਾਰੀ ਦਾ ਨਾਮ:</label>
        <input type="text" id="playerNameInput" maxlength="25" placeholder="ਆਪਣਾ ਨਾਮ ਲਿਖੋ..." autocomplete="off" oninput="onNameInput()">
        <span class="name-warn" id="nameWarn">⚠️ ਕਿਰਪਾ ਕਰਕੇ ਪਹਿਲਾਂ ਆਪਣਾ ਨਾਮ ਲਿਖੋ!</span>
      </div>
      <div class="timer-note">⏱️ ਹਰ ਪ੍ਰਸ਼ਨ ਲਈ 15 ਸਕਿੰਟ • 🔀 ਸ਼ਫ਼ਲ ਮੋਡ</div>
    </div>
    <div class="grid" id="chapterGrid"></div>
  </section>

  <!-- Quiz Screen -->
  <section id="quizScreen" class="quiz-wrap hidden">
    <div class="quiz-top">
      <button class="btn btn-menu" onclick="goHome()">⬅️ Back to Menu</button>
      <div class="quiz-stats">
        <div class="stat-pill">👤 <span id="activePlayer"></span></div>
        <div class="stat-pill">ਪ੍ਰਸ਼ਨ: <span id="qCount">1/20</span></div>
        <div class="stat-pill">ਸਕੋਰ: <span id="scoreVal">0</span></div>
        <div class="stat-pill">🔥 <span id="streakVal">0</span></div>
        <div class="stat-pill timer-pill" id="timerPill">⏱️ 15s</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="q-box">
      <div class="q-chapter" id="qChapter"></div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="options" id="optionsBox"></div>
    <div class="quiz-footer">
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">ਅਗਲਾ ਪ੍ਰਸ਼ਨ ➡️</button>
    </div>
  </section>

  <!-- Result Screen -->
  <section id="resultScreen" class="hidden">
    <div class="result-grid">
      <div class="result-card">
        <div class="stars" id="resultStars">⭐⭐⭐</div>
        <div class="result-player" id="resultPlayer"></div>
        <h2 id="resultChapter"></h2>
        <div class="result-score" id="resultScore">0 / 20</div>
        <p class="result-msg" id="resultMsg"></p>
        <div class="result-btns">
          <button class="btn btn-primary" onclick="restartChapter()">🔄 ਦੁਬਾਰਾ ਖੇਡੋ</button>
          <button class="btn btn-menu" onclick="goHome()">📋 Back to Menu</button>
          <a class="btn btn-hub" href="../index.html" onclick="playSound('click')">🏠 Back to Hub</a>
        </div>
      </div>
      <div class="lb-panel">
        <div class="lb-header">
          <h3 id="resultLbTitle">🏆 ਆਲ-ਟਾਈਮ ਲੀਡਰਬੋਰਡ</h3>
        </div>
        <div id="resultLbBody"></div>
      </div>
    </div>
  </section>
</main>

<!-- Leaderboard Modal -->
<div class="modal-bg hidden" id="lbModal" onclick="closeModalBg(event)">
  <div class="modal-box">
    <div class="lb-header">
      <h3 id="modalLbTitle">🏆 ਲੀਡਰਬੋਰਡ</h3>
      <button class="btn btn-sound" onclick="closeLbModal()">✖ ਬੰਦ ਕਰੋ</button>
    </div>
    <div id="modalLbBody"></div>
  </div>
</div>

<script>
// --- Fullscreen Helper ---
function enterFullscreen() {
  const elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    try {
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    } catch (e) {}
  }
}

// --- Web Audio API Sound Effects ---
let soundOn = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = null;
function initAudio() { if (!ctx) ctx = new AudioCtx(); if (ctx.state === 'suspended') ctx.resume(); }

function playSound(type) {
  if (!soundOn) return;
  initAudio();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'tick') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if (type === 'correct') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.08);
    osc.frequency.setValueAtTime(783.99, now + 0.16);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now); osc.stop(now + 0.35);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.linearRampToValueAtTime(140, now + 0.25);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.start(now); osc.stop(now + 0.28);
  } else if (type === 'win') {
    [523, 659, 784, 1046].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * 0.11);
      g.gain.setValueAtTime(0.16, now + i * 0.11);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + i * 0.11); o.stop(now + i * 0.11 + 0.3);
    });
  }
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '🔊 ਆਵਾਜ਼: ਚਾਲੂ' : '🔇 ਆਵਾਜ਼: ਬੰਦ';
  if (soundOn) playSound('click');
}

// --- Fisher-Yates Shuffle ---
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// --- 13 Chapters × 20 MCQs = 260 Questions (PSEB Class 8 Maths 2025-26) ---
const CHAPTERS = [
  {
    id: 1, title: "ਪਰਿਮੇਯ ਸੰਖਿਆਵਾਂ",
    q: [
      ["ਪਰਿਮੇਯ ਸੰਖਿਆਵਾਂ ਲਈ ਜੋੜ ਦਾ ਤਤਸਮਕ (Additive Identity) ਕੀ ਹੈ?", ["1", "0", "-1", "10"], 1],
      ["ਪਰਿਮੇਯ ਸੰਖਿਆਵਾਂ ਲਈ ਗੁਣਾ ਦਾ ਤਤਸਮਕ (Multiplicative Identity) ਕੀ ਹੈ?", ["0", "1", "-1", "2"], 1],
      ["-5/9 ਦਾ ਜੋੜਾਤਮਕ ਉਲਟ (Additive Inverse) ਕੀ ਹੈ?", ["5/9", "-9/5", "9/5", "0"], 0],
      ["-7/11 ਦਾ ਗੁਣਾਤਮਕ ਉਲਟ (Reciprocal) ਕੀ ਹੈ?", ["7/11", "-11/7", "11/7", "1"], 1],
      ["ਕਿਹੜੀ ਪਰਿਮੇਯ ਸੰਖਿਆ ਦਾ ਕੋਈ ਉਲਟਕ੍ਰਮ (Reciprocal) ਨਹੀਂ ਹੁੰਦਾ?", ["1", "-1", "0", "1/2"], 2],
      ["ਕਿਹੜੀਆਂ ਪਰਿਮੇਯ ਸੰਖਿਆਵਾਂ ਆਪਣੇ ਉਲਟਕ੍ਰਮ ਦੇ ਬਰਾਬਰ ਹੁੰਦੀਆਂ ਹਨ?", ["0 ਅਤੇ 1", "1 ਅਤੇ -1", "2 ਅਤੇ -2", "ਸਿਰਫ਼ 0"], 1],
      ["a + b = b + a ਕਿਹੜੇ ਗੁਣ ਨੂੰ ਦਰਸਾਉਂਦਾ ਹੈ?", ["ਜੋੜ ਦਾ ਕ੍ਰਮ-ਵਟਾਂਦਰਾ ਗੁਣ", "ਸਹਿਚਾਰਤਾ ਗੁਣ", "ਵੰਡਕਾਰੀ ਗੁਣ", "ਬੰਦ ਗੁਣ"], 0],
      ["a × (b + c) = a × b + a × c ਕਿਹੜਾ ਗੁਣ ਹੈ?", ["ਕ੍ਰਮ-ਵਟਾਂਦਰਾ ਗੁਣ", "ਵੰਡਕਾਰੀ ਗੁਣ (Distributive)", "ਸਹਿਚਾਰਤਾ ਗੁਣ", "ਤਤਸਮਕ ਗੁਣ"], 1],
      ["(3/5) × (5/3) ਦਾ ਮੁੱਲ ਕੀ ਹੋਵੇਗਾ?", ["0", "1", "15/15", "9/25"], 1],

// --- State ---
const TAGS = ['ੳ', 'ਅ', 'ੲ', 'ਸ'];
const TIME_LIMIT = 15;
let currentChIdx = 0;
let activeQuestions = [];
let currentQIdx = 0;
let score = 0;
let streak = 0;
let answered = false;
let playerName = '';
let timerInterval = null;
let timeLeft = TIME_LIMIT;
let totalTimeUsed = 0;
let lastRunId = null;

function resetNameField() {
  playerName = '';
  const input = document.getElementById('playerNameInput');
  input.value = '';
  document.getElementById('nameWarn').style.display = 'none';
}

function onNameInput() {
  playerName = document.getElementById('playerNameInput').value.trim();
  if (playerName) document.getElementById('nameWarn').style.display = 'none';
}

// --- Leaderboard Helpers (Class 8 Maths Separate Storage) ---
function getLeaderboard(chId) {
  try {
    return JSON.parse(localStorage.getItem('pseb8_math_lb_' + chId) || '[]');
  } catch { return []; }
}

function addLeaderboardEntry(chId, name, sc, timeSec) {
  const list = getLeaderboard(chId);
  const runId = Date.now();
  lastRunId = runId;
  list.push({ id: runId, name, score: sc, time: timeSec, date: new Date().toLocaleDateString('pa-IN') });
  list.sort((a, b) => (b.score - a.score) || (a.time - b.time));
  const top = list.slice(0, 15);
  localStorage.setItem('pseb8_math_lb_' + chId, JSON.stringify(top));
  return top;
}

function renderLeaderboardHTML(chId, highlightId = null) {
  const list = getLeaderboard(chId);
  if (!list.length) {
    return '<div class="lb-empty">ਅਜੇ ਕੋਈ ਸਕੋਰ ਦਰਜ ਨਹੀਂ ਹੋਇਆ। ਪਹਿਲੇ ਖਿਡਾਰੀ ਬਣੋ!</div>';
  }
  const medals = ['🥇', '🥈', '🥉'];
  let rows = list.map((r, i) => `
    <tr class="${r.id === highlightId ? 'me' : ''}">
      <td>${medals[i] || (i + 1)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td><strong>${r.score}/20</strong></td>
      <td>${r.time}s</td>
    </tr>
  `).join('');
  return `
    <table class="lb-table">
      <thead><tr><th>#</th><th>ਖਿਡਾਰੀ</th><th>ਸਕੋਰ</th><th>ਸਮਾਂ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function openLbModal(chId, chTitle) {
  playSound('click');
  document.getElementById('modalLbTitle').textContent = `🏆 ਅਧਿਆਇ ${chId}: ${chTitle}`;
  document.getElementById('modalLbBody').innerHTML = renderLeaderboardHTML(chId);
  document.getElementById('lbModal').classList.remove('hidden');
}

function closeLbModal() {
  playSound('click');
  document.getElementById('lbModal').classList.add('hidden');
}

function closeModalBg(e) {
  if (e.target.id === 'lbModal') closeLbModal();
}

// --- Home Screen ---
function renderHome() {
  const grid = document.getElementById('chapterGrid');
  grid.innerHTML = '';
  CHAPTERS.forEach((ch, idx) => {
    const lb = getLeaderboard(ch.id);
    const top = lb.length ? lb[0] : null;
    const card = document.createElement('div');
    card.className = 'ch-card';
    card.innerHTML = `
      <div class="ch-clickable" onclick="startChapter(${idx})">
        <div class="ch-num">ਅਧਿਆਇ ${ch.id} • 20 MCQ</div>
        <div class="ch-title">${ch.title}</div>
      </div>
      <div class="ch-meta">
        <span class="badge ${top ? 'done' : ''}" onclick="startChapter(${idx})" style="cursor:pointer;">
          ${top ? '🥇 ' + escapeHtml(top.name) + ' (' + top.score + '/20)' : '▶ ਸ਼ੁਰੂ ਕਰੋ'}
        </span>
        <button class="btn btn-lb" onclick="openLbModal(${ch.id}, '${ch.title.replace(/'/g, "\\'")}')">🏆 ਲੀਡਰਬੋਰਡ</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// --- Quiz Flow & 15s Timer ---
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function startTimer() {
  stopTimer();
  timeLeft = TIME_LIMIT;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft > 0 && timeLeft <= 5) playSound('tick');
    if (timeLeft <= 0) {
      stopTimer();
      handleTimeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  const pill = document.getElementById('timerPill');
  const fill = document.getElementById('timerFill');
  pill.textContent = `⏱️ ${timeLeft}s`;
  fill.style.width = `${(timeLeft / TIME_LIMIT) * 100}%`;
  if (timeLeft <= 5) {
    pill.classList.add('danger');
    fill.classList.add('danger');
  } else {
    pill.classList.remove('danger');
    fill.classList.remove('danger');
  }
}

function prepareShuffledQuestions(ch) {
  return shuffleArray(ch.q).map(([questionText, options, correctIdx]) => {
    const tagged = options.map((opt, idx) => ({ text: opt, isCorrect: idx === correctIdx }));
    const shuffledOpts = shuffleArray(tagged);
    return {
      text: questionText,
      options: shuffledOpts.map(o => o.text),
      correctIdx: shuffledOpts.findIndex(o => o.isCorrect)
    };
  });
}

function startChapter(idx) {
  playerName = document.getElementById('playerNameInput').value.trim() || playerName;
  if (!playerName) {
    playSound('wrong');
    document.getElementById('nameWarn').style.display = 'inline';
    document.getElementById('playerNameInput').focus();
    return;
  }
  enterFullscreen();
  playSound('click');
  currentChIdx = idx;
  activeQuestions = prepareShuffledQuestions(CHAPTERS[idx]);
  currentQIdx = 0;
  score = 0;
  streak = 0;
  totalTimeUsed = 0;
  document.getElementById('activePlayer').textContent = playerName;
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const ch = CHAPTERS[currentChIdx];
  const item = activeQuestions[currentQIdx];
  document.getElementById('qChapter').textContent = `ਅਧਿਆਇ ${ch.id}: ${ch.title}`;
  document.getElementById('qCount').textContent = `${currentQIdx + 1}/${activeQuestions.length}`;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;
  document.getElementById('progressFill').style.width = `${(currentQIdx / activeQuestions.length) * 100}%`;
  document.getElementById('qText').textContent = `${currentQIdx + 1}. ${item.text}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.add('hidden');

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-tag">${TAGS[i]}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i, btn);
    box.appendChild(btn);
  });

  startTimer();
}

function handleTimeUp() {
  if (answered) return;
  answered = true;
  totalTimeUsed += TIME_LIMIT;
  const item = activeQuestions[currentQIdx];
  const correctIdx = item.correctIdx;
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);
  allBtns[correctIdx].classList.add('correct');
  streak = 0;
  playSound('wrong');

  const fb = document.getElementById('feedback');
  fb.textContent = `⏰ ਸਮਾਂ ਸਮਾਪਤ! ਸਹੀ ਉੱਤਰ: (${TAGS[correctIdx]}) ${item.options[correctIdx]}`;
  fb.className = 'feedback no';
  document.getElementById('streakVal').textContent = streak;
  document.getElementById('progressFill').style.width = `${((currentQIdx + 1) / activeQuestions.length) * 100}%`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = (currentQIdx === activeQuestions.length - 1) ? 'ਨਤੀਜਾ ਦੇਖੋ 🏆' : 'ਅਗਲਾ ਪ੍ਰਸ਼ਨ ➡️';
  nextBtn.classList.remove('hidden');
}

function checkAnswer(selectedIdx, btn) {
  if (answered) return;
  answered = true;
  stopTimer();
  totalTimeUsed += (TIME_LIMIT - timeLeft);

  const item = activeQuestions[currentQIdx];
  const correctIdx = item.correctIdx;
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  if (selectedIdx === correctIdx) {
    btn.classList.add('correct');
    score++;
    streak++;
    playSound('correct');
    fb.textContent = '✅ ਸ਼ਾਬਾਸ਼! ਬਿਲਕੁਲ ਸਹੀ ਉੱਤਰ!';
    fb.className = 'feedback ok';
  } else {
    btn.classList.add('wrong');
    allBtns[correctIdx].classList.add('correct');
    streak = 0;
    playSound('wrong');
    fb.textContent = `❌ ਗਲਤ! ਸਹੀ ਉੱਤਰ: (${TAGS[correctIdx]}) ${item.options[correctIdx]}`;
    fb.className = 'feedback no';
  }

  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;
  document.getElementById('progressFill').style.width = `${((currentQIdx + 1) / activeQuestions.length) * 100}%`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = (currentQIdx === activeQuestions.length - 1) ? 'ਨਤੀਜਾ ਦੇਖੋ 🏆' : 'ਅਗਲਾ ਪ੍ਰਸ਼ਨ ➡️';
  nextBtn.classList.remove('hidden');
}

function nextQuestion() {
  playSound('click');
  if (currentQIdx < activeQuestions.length - 1) {
    currentQIdx++;
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  stopTimer();
  const ch = CHAPTERS[currentChIdx];
  addLeaderboardEntry(ch.id, playerName, score, totalTimeUsed);
  playSound('win');

  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultPlayer').textContent = `👤 ${playerName} • ⏱️ ${totalTimeUsed} ਸਕਿੰਟ`;
  document.getElementById('resultChapter').textContent = `ਅਧਿਆਇ ${ch.id}: ${ch.title}`;
  document.getElementById('resultScore').textContent = `${score} / ${activeQuestions.length}`;

  const pct = Math.round((score / activeQuestions.length) * 100);
  let stars = '⭐', msg = 'ਹੋਰ ਅਭਿਆਸ ਕਰੋ! ਤੁਸੀਂ ਹੋਰ ਵਧੀਆ ਕਰ ਸਕਦੇ ਹੋ।';
  if (pct >= 85) { stars = '⭐⭐⭐'; msg = 'ਸ਼ਾਨਦਾਰ ਪ੍ਰਦਰਸ਼ਨ! ਸਾਰੇ ਟੌਪਿਕ ਪੱਕੇ ਹਨ।'; }
  else if (pct >= 60) { stars = '⭐⭐'; msg = 'ਵਧੀਆ ਕੋਸ਼ਿਸ਼! ਥੋੜ੍ਹੀ ਹੋਰ ਦੁਹਰਾਈ ਨਾਲ 100% ਆ ਸਕਦੇ ਹਨ।'; }
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultMsg').textContent = `${pct}% — ${msg}`;

  document.getElementById('resultLbTitle').textContent = `🏆 ਅਧਿਆਇ ${ch.id} — ਆਲ-ਟਾਈਮ ਲੀਡਰਬੋਰਡ`;
  document.getElementById('resultLbBody').innerHTML = renderLeaderboardHTML(ch.id, lastRunId);
}

function restartChapter() {
  startChapter(currentChIdx);
}

function goHome() {
  stopTimer();
  playSound('click');
  resetNameField();
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
  renderHome();
}

resetNameField();
renderHome();
</script>
</body>
</html>
