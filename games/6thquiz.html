<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Class 6 Science Quiz - Smartboard Edition</title>
    <style>
        :root {
            --primary: #FF416C;
            --secondary: #FF4B2B;
            --info: #00B4DB;
            --info2: #0083B0;
            --correct: #00b09b;
            --correct2: #96c93d;
            --danger: #cb2d3e;
            --danger2: #ef473a;
            --dark: #2C3E50;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #FF416C, #FF4B2B, #00B4DB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: var(--glass);
            padding: 3vh 3vw;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            width: 90vw;
            height: 85vh;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.5);
            box-sizing: border-box;
        }

        h1 {
            color: var(--dark);
            font-size: 4vh;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 0 0 2vh 0;
        }

        input, select {
            width: 70%;
            padding: 2vh;
            margin: 1vh 0;
            font-size: 3vh;
            border: 3px solid var(--info);
            border-radius: 12px;
            outline: none;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
        }

        button {
            padding: 2vh 3vw;
            font-size: 3vh;
            margin: 1vh;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            text-transform: uppercase;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        .btn-primary { background: linear-gradient(to right, var(--primary), var(--secondary)); }
        .btn-secondary { background: linear-gradient(to right, #485563, #29323c); }
        .btn-danger { background: linear-gradient(to right, var(--danger), var(--danger2)); }
        .btn-info { background: linear-gradient(to right, var(--info), var(--info2)); }

        #optionsContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2vh 2vw;
            width: 100%;
            flex-grow: 1;
        }

        .option-btn {
            width: 100%;
            height: 100%;
            margin: 0;
            background: white;
            color: var(--dark);
            border: 3px solid var(--info);
            font-size: 3.5vh;
            box-shadow: 0 5px 0px var(--info2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh;
        }
        .option-btn:nth-child(1) { animation-delay: 0.1s; }
        .option-btn:nth-child(2) { animation-delay: 0.2s; }
        .option-btn:nth-child(3) { animation-delay: 0.3s; }
        .option-btn:nth-child(4) { animation-delay: 0.4s; }

        .option-btn.correct { 
            background: linear-gradient(to right, var(--correct), var(--correct2)); 
            color: white; 
            border-color: #000;
            box-shadow: 0 5px 0px #008000;
            animation: bounce 0.5s;
        }
        .option-btn.wrong { 
            background: linear-gradient(to right, var(--danger), var(--danger2)); 
            color: white; 
            border-color: #000;
            box-shadow: 0 5px 0px #8b0000;
            animation: shake 0.4s;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 3.5vh;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 1vh;
        }
        .timer-container {
            width: 100%;
            height: 2vh;
            background: #ddd;
            border-radius: 1vh;
            margin-bottom: 3vh;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        #timerBar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, var(--correct2), var(--correct));
            transition: width 1s linear, background-color 1s;
        }

        #questionText {
            font-size: 4.5vh; 
            margin-bottom: 3vh; 
            color: var(--dark);
            flex-shrink: 0;
        }

        .screen { display: none; width: 100%; height: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; animation: popIn 0.5s; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 2vh; font-size: 3vh; background: white;}
        th, td { padding: 1.5vh; border: 2px solid #ddd; }
        th { background: var(--info); color: white; }

        #confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <!-- SCREEN 1: Setup -->
    <div id="setupScreen" class="container screen active">
        <h1>🎮 ਵਿਗਿਆਨ ਕੁਇਜ਼ ਮਾਸਟਰ 🎮</h1>
        <input type="text" id="playerName" placeholder="ਵਿਦਿਆਰਥੀ ਦਾ ਨਾਂ (Enter Name)" autocomplete="off">
        <select id="chapterSelect">
            <option value="1">ਪਾਠ 1: ਭੋਜਨ ਦੇ ਤੱਤ</option>
            <option value="2">ਪਾਠ 2: ਵਸਤੂਆਂ ਦੇ ਸਮੂਹ ਬਣਾਉਣਾ</option>
            <option value="3">ਪਾਠ 3: ਪਦਾਰਥਾਂ ਦਾ ਨਿਖੇੜਨ</option>
            <option value="4">ਪਾਠ 4: ਪੌਦਿਆਂ ਨੂੰ ਜਾਣੋ</option>
            <option value="5">ਪਾਠ 5: ਸਰੀਰ ਵਿੱਚ ਗਤੀ</option>
            <option value="6">ਪਾਠ 6: ਸਜੀਵ ਅਤੇ ਉਹਨਾਂ ਦਾ ਚੌਗਿਰਦਾ</option>
            <option value="7">ਪਾਠ 7: ਗਤੀ ਅਤੇ ਦੂਰੀਆਂ ਦਾ ਮਾਪਣ</option>
            <option value="8">ਪਾਠ 8: ਪ੍ਰਕਾਸ਼, ਪਰਛਾਵੇਂ ਅਤੇ ਪਰਿਵਰਤਨ</option>
            <option value="9">ਪਾਠ 9: ਬਿਜਲੀ ਅਤੇ ਸਰਕਟ</option>
            <option value="10">ਪਾਠ 10: ਚੁੰਬਕਾਂ ਰਾਹੀਂ ਮਨੋਰੰਜਨ</option>
            <option value="11">ਪਾਠ 11: ਸਾਡੇ ਆਲੇ-ਦੁਆਲੇ ਹਵਾ</option>
        </select>
        <br>
        <button class="btn-primary" onclick="startQuiz()">▶️ ਸ਼ੁਰੂ ਕਰੋ (Start)</button>
        <br><br>
        <button class="btn-secondary" onclick="window.location.href='CLASS GAMES.html'">🔙 Back to Menu</button>
    </div>

    <!-- SCREEN 2: Quiz -->
    <div id="quizScreen" class="container screen">
        <div class="header-info">
            <div id="displayPlayer" style="color: var(--info2);"></div>
            <div style="color: var(--primary);">ਅੰਕ: <span id="score">0</span></div>
        </div>
        <div class="timer-container">
            <div id="timerBar"></div>
        </div>
        <h2 id="questionText"></h2>
        <div id="optionsContainer"></div>
        <br>
        <button class="btn-danger" style="flex-shrink: 0; margin-top: 2vh;" onclick="backToSetup()">🛑 ਛੱਡੋ (Quit)</button>
    </div>

    <!-- SCREEN 3: Result & Leaderboard -->
    <div id="resultScreen" class="container screen">
        <h1 style="font-size: 6vh; color: var(--primary);">🎉 ਨਤੀਜਾ (Result) 🎉</h1>
        <h2 id="finalScoreText" style="font-size: 5vh; margin: 1vh 0;"></h2>
        <h3 id="finalTimeText" style="font-size: 3.5vh; color: var(--dark); margin: 1vh 0;"></h3>
        
        <h3 style="margin-top: 2vh; color: var(--info2); font-size: 3.5vh;">🏆 ਆਲ-ਟਾਈਮ ਲੀਡਰਬੋਰਡ (Top 5) 🏆</h3>
        <div style="width: 100%; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ਨਾਂ</th>
                        <th>ਪਾਠ</th>
                        <th>ਅੰਕ</th>
                        <th>ਸਮਾਂ</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
        <br>
        <div>
            <button class="btn-info" onclick="startQuiz()">🔄 ਦੁਬਾਰਾ ਖੇਡੋ</button>
            <button class="btn-secondary" onclick="window.location.href='index.html'">🔙 Back to Menu</button>
        </div>
    </div>

<script>
    // QUESTION BANK
    const quizData = {
        "1": [
            {q: "ਆਲੂ ਵਿੱਚ ਕਿਹੜਾ ਪੌਸ਼ਟਿਕ ਤੱਤ ਹੁੰਦਾ ਹੈ?", options: ["ਕਾਰਬੋਹਾਈਡ੍ਰੇਟ", "ਪ੍ਰੋਟੀਨ", "ਚਰਬੀ", "ਵਿਟਾਮਿਨ"], ans: 0},
            {q: "ਸਰੀਰ ਬਣਾਉਣ ਵਾਲਾ ਭੋਜਨ ਕਿਸਨੂੰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ?", options: ["ਪ੍ਰੋਟੀਨ", "ਚਰਬੀ", "ਵਿਟਾਮਿਨ", "ਖਣਿਜ"], ans: 0},
            {q: "ਊਰਜਾ ਦੇਣ ਵਾਲੇ ਭੋਜਨ ਕਿਹੜੇ ਹਨ?", options: ["ਕਾਰਬੋਹਾਈਡ੍ਰੇਟ ਅਤੇ ਚਰਬੀ", "ਵਿਟਾਮਿਨ", "ਪਾਣੀ", "ਪ੍ਰੋਟੀਨ"], ans: 0},
            {q: "ਆਇਓਡੀਨ ਦੇ ਘੋਲ ਦੀ ਵਰਤੋਂ ਕਿਸ ਦੀ ਪਰਖ ਲਈ ਕੀਤੀ ਜਾਂਦੀ ਹੈ?", options: ["ਸਟਾਰਚ (ਕਾਰਬੋਹਾਈਡ੍ਰੇਟ)", "ਪ੍ਰੋਟੀਨ", "ਚਰਬੀ", "ਪਾਣੀ"], ans: 0},
            {q: "ਅੰਧਰਾਤਾ (ਰਾਤ ਦਾ ਅੰਨ੍ਹਾਪਣ) ਕਿਸ ਵਿਟਾਮਿਨ ਦੀ ਕਮੀ ਨਾਲ ਹੁੰਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ A", "ਵਿਟਾਮਿਨ B1", "ਵਿਟਾਮਿਨ C", "ਵਿਟਾਮਿਨ D"], ans: 0},
            {q: "ਸਕਰਵੀ ਰੋਗ ਕਿਸ ਵਿਟਾਮਿਨ ਦੀ ਕਮੀ ਨਾਲ ਹੁੰਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ C", "ਵਿਟਾਮਿਨ A", "ਵਿਟਾਮਿਨ D", "ਵਿਟਾਮਿਨ K"], ans: 0},
            {q: "ਹੱਡੀਆਂ ਅਤੇ ਦੰਦਾਂ ਦੀ ਮਜ਼ਬੂਤੀ ਲਈ ਕਿਹੜਾ ਖਣਿਜ ਜ਼ਰੂਰੀ ਹੈ?", options: ["ਕੈਲਸ਼ੀਅਮ", "ਲੋਹਾ", "ਆਇਓਡੀਨ", "ਸੋਡੀਅਮ"], ans: 0},
            {q: "ਬੇਰੀ-ਬੇਰੀ ਰੋਗ ਕਿਸ ਦੀ ਕਮੀ ਕਾਰਨ ਹੁੰਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ B1", "ਵਿਟਾਮਿਨ A", "ਪ੍ਰੋਟੀਨ", "ਚਰਬੀ"], ans: 0},
            {q: "ਗਿੱਲੜ (Goitre) ਰੋਗ ਕਿਸ ਖਣਿਜ ਦੀ ਕਮੀ ਨਾਲ ਹੁੰਦਾ ਹੈ?", options: ["ਆਇਓਡੀਨ", "ਲੋਹਾ", "ਕੈਲਸ਼ੀਅਮ", "ਫਾਸਫੋਰਸ"], ans: 0},
            {q: "ਅਨੀਮੀਆ ਰੋਗ ਕਿਸ ਦੀ ਕਮੀ ਨਾਲ ਹੁੰਦਾ ਹੈ?", options: ["ਲੋਹਾ", "ਕੈਲਸ਼ੀਅਮ", "ਵਿਟਾਮਿਨ D", "ਪ੍ਰੋਟੀਨ"], ans: 0},
            {q: "ਸੂਰਜ ਦੀ ਰੌਸ਼ਨੀ ਤੋਂ ਸਾਨੂੰ ਕਿਹੜਾ ਵਿਟਾਮਿਨ ਮਿਲਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ D", "ਵਿਟਾਮਿਨ A", "ਵਿਟਾਮਿਨ C", "ਵਿਟਾਮਿਨ E"], ans: 0},
            {q: "ਪ੍ਰੋਟੀਨ ਦੀ ਪਰਖ ਲਈ ਕਿਹੜੇ ਰਸਾਇਣ ਵਰਤੇ ਜਾਂਦੇ ਹਨ?", options: ["ਕਾਪਰ ਸਲਫੇਟ ਅਤੇ ਕਾਸਟਿਕ ਸੋਡਾ", "ਆਇਓਡੀਨ", "ਨਮਕ", "ਚੀਨੀ"], ans: 0},
            {q: "ਕਾਗਜ਼ 'ਤੇ ਤੇਲ ਦਾ ਧੱਬਾ ਕਿਸ ਪੌਸ਼ਟਿਕ ਤੱਤ ਦੀ ਮੌਜੂਦਗੀ ਦਰਸਾਉਂਦਾ ਹੈ?", options: ["ਚਰਬੀ", "ਪ੍ਰੋਟੀਨ", "ਵਿਟਾਮਿਨ", "ਪਾਣੀ"], ans: 0},
            {q: "ਰੁੱਖਾਂਸ਼ (ਮੋਟਾ ਆਹਾਰ) ਕਿਸ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ?", options: ["ਭੋਜਨ ਪਚਾਉਣ ਅਤੇ ਮਲ ਤਿਆਗ ਵਿੱਚ", "ਊਰਜਾ ਦੇਣ ਵਿੱਚ", "ਬਿਮਾਰੀਆਂ ਤੋਂ ਬਚਾਉਣ ਵਿੱਚ", "ਖੂਨ ਬਣਾਉਣ ਵਿੱਚ"], ans: 0},
            {q: "ਰਿਕਟਸ (ਹੱਡੀਆਂ ਦਾ ਟੇਢਾ ਹੋਣਾ) ਕਿਸ ਕਮੀ ਕਾਰਨ ਹੁੰਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ D", "ਵਿਟਾਮਿਨ C", "ਆਇਓਡੀਨ", "ਲੋਹਾ"], ans: 0},
            {q: "ਸਾਡੇ ਸਰੀਰ ਦਾ ਲਗਭਗ ਕਿੰਨਾ ਹਿੱਸਾ ਪਾਣੀ ਹੈ?", options: ["70%", "30%", "50%", "90%"], ans: 0},
            {q: "ਸੰਤੁਲਿਤ ਆਹਾਰ ਕੀ ਹੈ?", options: ["ਸਾਰੇ ਪੌਸ਼ਟਿਕ ਤੱਤਾਂ ਦੀ ਸਹੀ ਮਾਤਰਾ ਵਾਲਾ ਭੋਜਨ", "ਸਿਰਫ ਪ੍ਰੋਟੀਨ ਵਾਲਾ ਭੋਜਨ", "ਫਾਸਟ ਫੂਡ", "ਸਿਰਫ ਫਲ"], ans: 0},
            {q: "ਵਿਟਾਮਿਨ C ਦਾ ਮੁੱਖ ਸ੍ਰੋਤ ਕੀ ਹੈ?", options: ["ਖੱਟੇ ਫਲ (ਔਲਾ, ਨਿੰਬੂ)", "ਦੁੱਧ", "ਮੀਟ", "ਕਣਕ"], ans: 0},
            {q: "ਭੋਜਨ ਨੂੰ ਜ਼ਿਆਦਾ ਪਕਾਉਣ ਨਾਲ ਕਿਹੜਾ ਵਿਟਾਮਿਨ ਨਸ਼ਟ ਹੋ ਜਾਂਦਾ ਹੈ?", options: ["ਵਿਟਾਮਿਨ C", "ਵਿਟਾਮਿਨ A", "ਵਿਟਾਮਿਨ D", "ਵਿਟਾਮਿਨ E"], ans: 0},
            {q: "ਜ਼ਿਆਦਾ ਚਰਬੀ ਵਾਲਾ ਭੋਜਨ ਖਾਣ ਨਾਲ ਕੀ ਹੁੰਦਾ ਹੈ?", options: ["ਮੋਟਾਪਾ", "ਕਮਜ਼ੋਰੀ", "ਲੰਬਾਈ ਵਧਦੀ ਹੈ", "ਬਿਮਾਰੀਆਂ ਠੀਕ ਹੁੰਦੀਆਂ ਹਨ"], ans: 0}
        ],
        "2": [
            {q: "ਹੇਠ ਲਿਖਿਆਂ ਵਿੱਚੋਂ ਕਿਹੜਾ ਪਦਾਰਥ ਚਮਕਦਾਰ ਹੈ?", options: ["ਸੋਨਾ", "ਲੱਕੜ", "ਪਲਾਸਟਿਕ", "ਕਾਗਜ਼"], ans: 0},
            {q: "ਕਿਹੜਾ ਪਦਾਰਥ ਪਾਣੀ ਵਿੱਚ ਘੁਲਣਸ਼ੀਲ ਹੈ?", options: ["ਖੰਡ", "ਰੇਤ", "ਚਾਕ ਪਾਊਡਰ", "ਲੱਕੜ ਦਾ ਬੂਰਾ"], ans: 0},
            {q: "ਕਿਹੜੀ ਵਸਤੂ ਪਾਰਦਰਸ਼ੀ ਹੈ?", options: ["ਕੱਚ", "ਲੱਕੜ", "ਲੋਹਾ", "ਪੱਥਰ"], ans: 0},
            {q: "ਜਿਨ੍ਹਾਂ ਪਦਾਰਥਾਂ ਵਿੱਚੋਂ ਦੇਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ, ਉਹਨਾਂ ਨੂੰ ਕੀ ਕਹਿੰਦੇ ਹਨ?", options: ["ਅਪਾਰਦਰਸ਼ੀ", "ਪਾਰਦਰਸ਼ੀ", "ਅਲਪ-ਪਾਰਦਰਸ਼ੀ", "ਚਮਕਦਾਰ"], ans: 0},
            {q: "ਤੇਲ ਲੱਗਿਆ ਕਾਗਜ਼ ਕੀ ਹੁੰਦਾ ਹੈ?", options: ["ਅਲਪ-ਪਾਰਦਰਸ਼ੀ", "ਪਾਰਦਰਸ਼ੀ", "ਅਪਾਰਦਰਸ਼ੀ", "ਕਠੋਰ"], ans: 0},

    // GAME VARIABLES
    let playerName = "";
    let currentChapter = "";
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15;
    let startTime;
    let totalTimeTaken = 0;

    // FULLSCREEN HANDLER
    function openFullscreen() {
        let elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log(err));
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }

    function exitFullscreen() {
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => console.log(err));
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }

    // AUDIO SYSTEM
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'wrong' || type === 'timeout') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    // GAME LOGIC
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('confetti').style.display = 'none'; 
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startQuiz() {
        openFullscreen(); 
        initAudio();
        
        let nameInput = document.getElementById('playerName').value.trim();
        if (nameInput) playerName = nameInput;
        
        currentChapter = document.getElementById('chapterSelect').value;

        if (!playerName) {
            alert("ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਨਾਂ ਲਿਖੋ! (Please enter your name)");
            return;
        }

        let baseQuestions = quizData[currentChapter];
        if (!baseQuestions || baseQuestions.length === 0) {
            alert("ਇਸ ਪਾਠ ਦੇ ਪ੍ਰਸ਼ਨ ਜਲਦੀ ਆ ਰਹੇ ਹਨ! (Questions coming soon!)");
            return;
        }

        currentQuestions = JSON.parse(JSON.stringify(baseQuestions));
        shuffleArray(currentQuestions);
        
        currentQuestions.forEach(q => {
            let correctText = q.options[q.ans];
            shuffleArray(q.options);
            q.ans = q.options.indexOf(correctText);
        });

        currentQuestionIndex = 0;
        score = 0;
        totalTimeTaken = 0;
        
        document.getElementById('displayPlayer').innerText = "👤 " + playerName;
        document.getElementById('score').innerText = score;
        
        showScreen('quizScreen');
        startTime = Date.now();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentQuestions.length) {
            endQuiz();
            return;
        }

        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('questionText').innerText = `ਪ੍ਰਸ਼ਨ ${currentQuestionIndex + 1}: ${q.q}`;
        
        let optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 15;
        updateTimerUI();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                playSound('timeout');
                highlightAnswers(-1); 
                setTimeout(nextQuestion, 1500);
            }
        }, 1000);
    }

    function updateTimerUI() {
        let bar = document.getElementById('timerBar');
        let percentage = (timeLeft / 15) * 100;
        bar.style.width = percentage + '%';
        
        if (percentage > 50) {
            bar.style.background = 'linear-gradient(to right, var(--correct2), var(--correct))';
        } else if (percentage > 25) {
            bar.style.background = 'linear-gradient(to right, #f6d365, #fda085)'; 
        } else {
            bar.style.background = 'linear-gradient(to right, var(--danger), var(--danger2))'; 
        }
    }

    function checkAnswer(selectedIndex, btnElement) {
        clearInterval(timerInterval);
        let buttons = document.getElementById('optionsContainer').querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        let correctIndex = currentQuestions[currentQuestionIndex].ans;
        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
            playSound('correct');
        } else {
            btnElement.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
            playSound('wrong');
        }
        
        setTimeout(nextQuestion, 1500);
    }

    function highlightAnswers(selectedIndex) {
        let correctIndex = currentQuestions[currentQuestionIndex].ans;
        let buttons = document.getElementById('optionsContainer').querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);
        buttons[correctIndex].classList.add('correct');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function endQuiz() {
        clearInterval(timerInterval);
        totalTimeTaken = Math.floor((Date.now() - startTime) / 1000);
        
        playSound('win');
        document.getElementById('finalScoreText').innerText = `ਤੁਹਾਡਾ ਸਕੋਰ: ${score} / ${currentQuestions.length * 10}`;
        document.getElementById('finalTimeText').innerText = `ਲਿਆ ਗਿਆ ਸਮਾਂ: ${totalTimeTaken} ਸਕਿੰਟ ⏱️`;
        
        saveAndShowLeaderboard();
        showScreen('resultScreen');
        
        if (score > (currentQuestions.length * 5)) {
            triggerConfetti();
        }
    }

    function saveAndShowLeaderboard() {
        let board = JSON.parse(localStorage.getItem('sci6Leaderboard')) || [];
        board.push({
            name: playerName,
            chapter: currentChapter,
            score: score,
            time: totalTimeTaken
        });

        board.sort((a, b) => b.score - a.score || a.time - b.time);
        localStorage.setItem('sci6Leaderboard', JSON.stringify(board));

        let tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '';
        
        let limit = Math.min(board.length, 5);
        for (let i = 0; i < limit; i++) {
            let row = `<tr>
                <td>${board[i].name}</td>
                <td>ਪਾਠ ${board[i].chapter}</td>
                <td>${board[i].score}</td>
                <td>${board[i].time}s</td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    function backToSetup() {
        clearInterval(timerInterval);
        exitFullscreen();
        showScreen('setupScreen');
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.display = 'block';

        let pieces = [];
        let colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];

        for(let i=0; i<100; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 3 + 2,
                angle: Math.random() * 360,
                spin: Math.random() * 0.2 - 0.1
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            for(let i=0; i<pieces.length; i++) {
                let p = pieces[i];
                p.y += p.speed;
                p.angle += p.spin;
                
                if (p.y < canvas.height) active = true;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();
            }
            if (active) requestAnimationFrame(draw);
            else canvas.style.display = 'none';
        }
        draw();
    }
</script>
</body>
</html>
